name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build and test
        run: make CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -Werror -O2" test
